name: Release & Publish

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  release:
    name: Draft Release & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: tiborrr/vpic-api-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Release Body
        run: |
          echo "## 🚀 Docker Image is Live!" > release_body.md
          echo "" >> release_body.md
          echo "You can pull the latest image for this release directly from Docker Hub:" >> release_body.md
          echo "\`\`\`bash" >> release_body.md
          echo "docker pull tiborrr/vpic-api-service:${{ github.ref_name }}" >> release_body.md
          echo "\`\`\`" >> release_body.md
          echo "" >> release_body.md
          echo "[**📦 View on Docker Hub**](https://hub.docker.com/r/tiborrr/vpic-api-service)" >> release_body.md
          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "### Changelog" >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: tiborrr/vpic-api-service
          short-description: "Blazing-fast VIN decoding API powered by FastAPI, PostgreSQL, and official NHTSA vPIC data."
          readme-filepath: ./README.md
