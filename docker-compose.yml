version: '3.8'
services:
  db:
    image: postgres:17
    container_name: vin-api-db-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpic_password}
      POSTGRES_DB: ${POSTGRES_DB:-vpic_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
