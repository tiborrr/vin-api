{% extends "base.html" %}

{% block content %}
<search>
    <form hx-get="/ui/validate" hx-target="#result" hx-indicator="#loading">
        <div class="input-group">
            <label for="vin">Vehicle Identification Number</label>
            <input type="search" id="vin" name="vin" placeholder="Enter a 17-character VIN..." required minlength="11" maxlength="17" autocomplete="off" spellcheck="false" autofocus>
        </div>
        <button type="submit">
            Decode VIN
            <svg id="loading" class="htmx-indicator" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite" />
            </svg>
        </button>
    </form>
</search>

<div id="result" aria-live="polite">
    <!-- Decoded VIN partials will be injected here by HTMX -->
</div>
{% endblock %}
