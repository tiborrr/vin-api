<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VIN Decoder API{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="/static/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <script src="https://unpkg.com/htmx.org@2.0.9"></script>
</head>
<body>
    <header>
        <img src="/static/logo.png" alt="VIN Decoder API" class="main-logo" width="250">
        <p>Powered by the National Highway Traffic Safety Administration vPIC Database</p>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Built with FastAPI and HTMX.</p>
    </footer>
</body>
</html>
