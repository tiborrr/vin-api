[project]
name = "vin-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "testcontainers-postgres>=0.0.1rc1",
]

[tool.pytest.ini_options]
addopts = "--asyncio-mode=auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "recommended"
include = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
